services:
  # ============== 数据层 ==============
  postgres:
    image: postgres:16-alpine
    container_name: playforge-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: playforge
      POSTGRES_PASSWORD: playforge_dev_2026
      POSTGRES_DB: playforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playforge-network

  mongo:
    image: mongo:7
    container_name: playforge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: playforge
      MONGO_INITDB_ROOT_PASSWORD: playforge_dev_2026
      MONGO_INITDB_DATABASE: playforge
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playforge-network

  redis:
    image: redis:7-alpine
    container_name: playforge-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass playforge_dev_2026 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "playforge_dev_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playforge-network

  # ============== 业务服务层 ==============
  user-service:
    build:
      context: .
      dockerfile: packages/user-service/Dockerfile
    container_name: playforge-user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://playforge:playforge_dev_2026@postgres:5432/playforge
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      JWT_SECRET: playforge_jwt_secret_dev_2026
      JWT_REFRESH_SECRET: playforge_refresh_secret_dev_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playforge-network

  game-service:
    build:
      context: .
      dockerfile: packages/game-service/Dockerfile
    container_name: playforge-game-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://playforge:playforge_dev_2026@postgres:5432/playforge
      MONGO_URL: mongodb://playforge:playforge_dev_2026@mongo:27017/playforge?authSource=admin
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
      APP_URL: ${GAME_SERVICE_URL:-http://localhost:3002}
      JWT_SECRET: playforge_jwt_secret_dev_2026
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playforge-network

  social-service:
    build:
      context: .
      dockerfile: packages/social-service/Dockerfile
    container_name: playforge-social-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://playforge:playforge_dev_2026@postgres:5432/playforge
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      JWT_SECRET: playforge_jwt_secret_dev_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playforge-network

  feed-service:
    build:
      context: .
      dockerfile: packages/feed-service/Dockerfile
    container_name: playforge-feed-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://playforge:playforge_dev_2026@postgres:5432/playforge
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      JWT_SECRET: playforge_jwt_secret_dev_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playforge-network

  ai-engine:
    build:
      context: ./packages/ai-engine
      dockerfile: Dockerfile
    container_name: playforge-ai-engine
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: development
      MONGO_URL: mongodb://playforge:playforge_dev_2026@mongo:27017/playforge?authSource=admin
      MONGO_DB_NAME: playforge
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-deepseek-chat}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
      CLAUDE_FAST_MODEL: ${CLAUDE_FAST_MODEL:-claude-haiku-4-5-20251001}
      TEMPLATE_CONFIDENCE_THRESHOLD: "0.8"
      HYBRID_CONFIDENCE_THRESHOLD: "0.5"
      QA_MAX_RETRIES: "3"
      PIPELINE_TIMEOUT_S: "60"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playforge-network

  # ============== API网关 ==============
  nginx:
    image: nginx:alpine
    container_name: playforge-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - user-service
      - game-service
      - social-service
      - feed-service
      - ai-engine
    networks:
      - playforge-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  playforge-network:
    driver: bridge
