services:
  # ============== 数据层 ==============
  mysql:
    image: mysql:8.0
    container_name: gamevallies-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: playforge_dev_2026
      MYSQL_DATABASE: gamevallies
      MYSQL_USER: gamevallies
      MYSQL_PASSWORD: playforge_dev_2026
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "gamevallies", "-pplayforge_dev_2026"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamevallies-network

  redis:
    image: redis:7-alpine
    container_name: gamevallies-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    command: redis-server --requirepass playforge_dev_2026 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "playforge_dev_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamevallies-network

  # ============== 业务服务层 ==============
  user-service:
    build:
      context: .
      dockerfile: packages/user-service/Dockerfile
    container_name: gamevallies-user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: mysql://gamevallies:playforge_dev_2026@mysql:3306/gamevallies?connection_limit=2
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      JWT_SECRET: playforge_jwt_secret_dev_2026
      JWT_REFRESH_SECRET: playforge_refresh_secret_dev_2026
      # 阿里云短信
      ALIYUN_ACCESS_KEY_ID: REMOVED_CREDENTIAL
      ALIYUN_ACCESS_KEY_SECRET: REMOVED_CREDENTIAL
      ALIYUN_REGION_ID: cn-hangzhou
      ALIYUN_ENDPOINT: dypnsapi.aliyuncs.com
      ALIYUN_SMS_SIGN_NAME: 速通互联验证码
      ALIYUN_SMS_TEMPLATE_CODE: "100001"
      ALIYUN_SMS_TEMPLATE_PARAM_CODE: code
      ALIYUN_SMS_TEMPLATE_PARAM_MIN: min
      VERIFY_CODE_SEND_INTERVAL_SECONDS: "60"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamevallies-network

  game-service:
    build:
      context: .
      dockerfile: packages/game-service/Dockerfile
    container_name: gamevallies-game-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: mysql://gamevallies:playforge_dev_2026@mysql:3306/gamevallies?connection_limit=2
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
      APP_URL: ${GAME_SERVICE_URL:-http://localhost:3002}
      JWT_SECRET: playforge_jwt_secret_dev_2026
      CORS_ORIGIN: "*"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin123}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/v1/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamevallies-network

  social-service:
    build:
      context: .
      dockerfile: packages/social-service/Dockerfile
    container_name: gamevallies-social-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: mysql://gamevallies:playforge_dev_2026@mysql:3306/gamevallies?connection_limit=2
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      JWT_SECRET: playforge_jwt_secret_dev_2026
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/api/v1/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamevallies-network

  feed-service:
    build:
      context: .
      dockerfile: packages/feed-service/Dockerfile
    container_name: gamevallies-feed-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: mysql://gamevallies:playforge_dev_2026@mysql:3306/gamevallies?connection_limit=2
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      JWT_SECRET: playforge_jwt_secret_dev_2026
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/api/v1/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamevallies-network

  ai-engine:
    build:
      context: ./packages/ai-engine
      dockerfile: Dockerfile
    container_name: gamevallies-ai-engine
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: mysql://gamevallies:playforge_dev_2026@mysql:3306/gamevallies
      REDIS_URL: redis://:playforge_dev_2026@redis:6379
      LLM_MODE: real
      LLM_API_KEY: REMOVED_CREDENTIAL
      LLM_BASE_URL: https://api.minimaxi.com/v1
      LLM_MODEL: MiniMax-M2.5
      LLM_FAST_MODEL: MiniMax-M2.5
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
      CLAUDE_FAST_MODEL: ${CLAUDE_FAST_MODEL:-claude-haiku-4-5-20251001}
      TEMPLATE_CONFIDENCE_THRESHOLD: "0.8"
      HYBRID_CONFIDENCE_THRESHOLD: "0.5"
      QA_MAX_RETRIES: "3"
      PIPELINE_TIMEOUT_S: "600"
    volumes:
      - ./packages/ai-engine/src:/app/src
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamevallies-network

  # ============== 前端 ==============
  frontend:
    build:
      context: ../gamevallies-front
      dockerfile: Dockerfile
    container_name: gamevallies-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - gamevallies-network

  # ============== API网关 ==============
  nginx:
    image: nginx:alpine
    container_name: gamevallies-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - user-service
      - game-service
      - social-service
      - feed-service
      - ai-engine
    networks:
      - gamevallies-network

volumes:
  mysql_data:
  redis_data:

networks:
  gamevallies-network:
    driver: bridge
