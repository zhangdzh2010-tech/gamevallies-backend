<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>星际矿工 - Space Miner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'PingFang SC','Microsoft YaHei',sans-serif;touch-action:none;}
canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
'use strict';
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');

// --- Resize ---
function resize(){
  canvas.width=window.innerWidth*devicePixelRatio;
  canvas.height=window.innerHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();
window.addEventListener('resize',resize);
const W=()=>window.innerWidth, H=()=>window.innerHeight;

// --- Game State ---
const STATE={MENU:0,PLAYING:1,BASE:2,GAMEOVER:3};
let state=STATE.MENU;

// --- Utility ---
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}
function rand(a,b){return a+Math.random()*(b-a);}
function randInt(a,b){return Math.floor(rand(a,b+1));}
function choose(arr){return arr[Math.floor(Math.random()*arr.length)];}
function lerp(a,b,t){return a+(b-a)*t;}

// --- Resource Types ---
const RES_TYPES=[
  {id:'iron',name:'铁矿',color:'#999',value:10,chance:0.55,size:[18,30]},
  {id:'gold',name:'金矿',color:'#ffd700',value:30,chance:0.25,size:[15,25]},
  {id:'diamond',name:'钻石',color:'#00e5ff',value:100,chance:0.14,size:[12,20]},
  {id:'darkmatter',name:'暗物质',color:'#b040ff',value:500,chance:0.06,size:[10,18]},
];

// --- Upgrades ---
const UPGRADE_DEFS=[
  {id:'engine',name:'引擎',desc:'提升飞船速度',baseCost:100,costMul:2.2,levels:5,stat:'speed',baseVal:3,perLevel:1},
  {id:'cargo',name:'货舱',desc:'增加货舱容量',baseCost:80,costMul:2,levels:5,stat:'maxCargo',baseVal:10,perLevel:8},
  {id:'laser',name:'采矿激光',desc:'加快采矿速度',baseCost:120,costMul:2.5,levels:5,stat:'mineSpeed',baseVal:1,perLevel:0.5},
  {id:'shield',name:'护盾',desc:'增加生命值',baseCost:150,costMul:2,levels:5,stat:'maxHp',baseVal:100,perLevel:30},
];

// --- Mission Definitions ---
const MISSION_TEMPLATES=[
  {desc:'采集{n}个铁矿',type:'mine',res:'iron',count:[5,15]},
  {desc:'采集{n}个金矿',type:'mine',res:'gold',count:[3,8]},
  {desc:'采集{n}个钻石',type:'mine',res:'diamond',count:[2,5]},
  {desc:'采集{n}个暗物质',type:'mine',res:'darkmatter',count:[1,3]},
  {desc:'消灭{n}个太空海盗',type:'kill',count:[2,5]},
  {desc:'出售价值{n}的资源',type:'sell',count:[200,800]},
  {desc:'存活{n}秒',type:'survive',count:[60,180]},
];

// --- Player ---
let player, upgrades, credits, cargo, cargoItems, missions, level, dayTime, gameTime, score;
let asteroids=[], meteors=[], pirates=[], blackholes=[], bullets=[], particles=[], stars=[];
let baseStation;
let miningTarget=null, miningProgress=0;
let shakeTimer=0, shakeIntensity=0;
let baseCooldown=0;
let touchStart=null, touchCurrent=null, isTouching=false;
let notification='', notifyTimer=0;
let bossWarning=0;

function initGame(){
  player={x:W()/2,y:H()/2-150,angle:0,speed:0,tx:W()/2,ty:H()/2-150,hp:100,maxHp:100,
    maxCargo:10,mineSpeed:1,moveSpeed:3,invuln:0,trail:[]};
  upgrades={engine:0,cargo:0,laser:0,shield:0};
  credits=0; cargo=0; cargoItems={iron:0,gold:0,diamond:0,darkmatter:0};
  missions=[]; level=1; dayTime=0; gameTime=0; score=0;
  asteroids=[]; meteors=[]; pirates=[]; blackholes=[]; bullets=[]; particles=[];
  miningTarget=null; miningProgress=0;
  notification=''; notifyTimer=0;
  baseCooldown=60;
  applyUpgrades();
  initStars();
  initBase();
  spawnAsteroids(15);
  generateMission();
  state=STATE.PLAYING;
}

function applyUpgrades(){
  for(let u of UPGRADE_DEFS){
    let lv=upgrades[u.id];
    player[u.stat]=u.baseVal+u.perLevel*lv;
  }
  player.moveSpeed=player.speed;
}

function initStars(){
  stars=[];
  for(let i=0;i<120;i++){
    stars.push({x:rand(0,2000),y:rand(0,2000),size:rand(0.5,2.5),speed:rand(0.1,0.5),bright:rand(0.3,1)});
  }
}

function initBase(){
  baseStation={x:W()/2,y:H()/2,radius:40};
}

// --- Spawn ---
function spawnAsteroids(count){
  for(let i=0;i<count;i++){
    let r=Math.random(), type;
    let cum=0;
    for(let t of RES_TYPES){cum+=t.chance; if(r<cum){type=t;break;}}
    if(!type) type=RES_TYPES[0];
    // Night cycle affects spawn rates
    if(dayTime>0.5 && dayTime<0.8){
      // More rare at night
      if(Math.random()<0.15) type=RES_TYPES[3]; // dark matter bonus
    }
    let sz=rand(type.size[0],type.size[1]);
    let a={x:rand(50,W()-50),y:rand(80,H()-80),radius:sz,type:type,hp:sz*2,maxHp:sz*2,
      rot:rand(0,Math.PI*2),rotSpeed:rand(-0.02,0.02),
      verts:[]};
    // Make sure not on base
    if(dist(a,baseStation)<100){a.x+=150;a.y+=150;}
    // Gen irregular shape
    let nv=randInt(6,10);
    for(let j=0;j<nv;j++){
      a.verts.push(rand(0.7,1.3));
    }
    asteroids.push(a);
  }
}

function spawnMeteor(){
  let side=randInt(0,3);
  let m={radius:rand(6,14),speed:rand(2,5),damage:15+level*3};
  if(side===0){m.x=rand(0,W());m.y=-20;m.angle=rand(Math.PI*0.2,Math.PI*0.8);}
  else if(side===1){m.x=W()+20;m.y=rand(0,H());m.angle=rand(Math.PI*0.6,Math.PI*1.4);}
  else if(side===2){m.x=rand(0,W());m.y=H()+20;m.angle=rand(-Math.PI*0.8,-Math.PI*0.2);}
  else{m.x=-20;m.y=rand(0,H());m.angle=rand(-Math.PI*0.4,Math.PI*0.4);}
  m.trail=[];
  meteors.push(m);
}

function spawnPirate(){
  if(pirates.length>=3+level) return;
  let side=randInt(0,3);
  let p={radius:14,hp:30+level*15,maxHp:30+level*15,speed:1.5+level*0.2,
    fireCooldown:Math.max(30,90-level*5),fireRate:90-level*5,damage:10+level*2,
    angle:0,trail:[]};
  if(side===0){p.x=rand(0,W());p.y=-30;}
  else if(side===1){p.x=W()+30;p.y=rand(0,H());}
  else if(side===2){p.x=rand(0,W());p.y=H()+30;}
  else{p.x=-30;p.y=rand(0,H());}
  pirates.push(p);
}

function spawnBlackhole(){
  if(blackholes.length>=1+Math.floor(level/3)) return;
  let bh={x:rand(80,W()-80),y:rand(120,H()-120),radius:25+level*3,
    pullRadius:120+level*15,strength:Math.min(0.3+level*0.05,0.8),rot:0,lifetime:600+level*60};
  if(dist(bh,baseStation)<150){bh.x+=200;}
  blackholes.push(bh);
}

// --- Missions ---
function generateMission(){
  if(missions.length>=2) return;
  let tpl=choose(MISSION_TEMPLATES);
  let n=randInt(tpl.count[0],tpl.count[1]);
  n=Math.ceil(n*(1+level*0.3));
  let reward=Math.floor(n*tpl.count[0]*10*(1+level*0.2));
  let m={desc:tpl.desc.replace('{n}',n),type:tpl.type,res:tpl.res,
    target:n,progress:0,reward:reward,completed:false};
  missions.push(m);
}

function updateMissions(type,res,amount){
  for(let m of missions){
    if(m.completed) continue;
    if(m.type===type){
      if(type==='mine' && m.res===res) m.progress+=amount;
      else if(type==='kill') m.progress+=amount;
      else if(type==='sell') m.progress+=amount;
      else if(type==='survive') m.progress+=amount;
      if(m.progress>=m.target){
        m.completed=true;
        credits+=m.reward;
        showNotify('任务完成！+'+m.reward+' 信用币');
        score+=m.reward;
      }
    }
  }
}

function cleanMissions(){
  missions=missions.filter(m=>!m.completed);
  generateMission();
}

// --- Particles ---
function emitParticles(x,y,color,count,speed,life){
  for(let i=0;i<count;i++){
    let a=rand(0,Math.PI*2);
    let s=rand(speed*0.3,speed);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:rand(life*0.5,life),maxLife:life,color,size:rand(1,3)});
  }
}

function showNotify(msg){notification=msg;notifyTimer=180;}

// --- Touch ---
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  let t=e.touches[0];
  let x=t.clientX, y=t.clientY;
  if(state===STATE.MENU){initGame();return;}
  if(state===STATE.GAMEOVER){state=STATE.MENU;return;}
  if(state===STATE.BASE){handleBaseTouch(x,y);return;}
  touchStart={x,y}; touchCurrent={x,y}; isTouching=true;
  // Check if tapping asteroid to mine
  checkMiningTap(x,y);
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!isTouching) return;
  let t=e.touches[0];
  touchCurrent={x:t.clientX,y:t.clientY};
  if(state===STATE.PLAYING && !miningTarget){
    player.tx=touchCurrent.x;
    player.ty=touchCurrent.y;
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  isTouching=false;
  touchStart=null; touchCurrent=null;
  miningTarget=null; miningProgress=0;
},{passive:false});

// Mouse fallback
canvas.addEventListener('mousedown',e=>{
  let x=e.clientX,y=e.clientY;
  if(state===STATE.MENU){initGame();return;}
  if(state===STATE.GAMEOVER){state=STATE.MENU;return;}
  if(state===STATE.BASE){handleBaseTouch(x,y);return;}
  touchStart={x,y};touchCurrent={x,y};isTouching=true;
  checkMiningTap(x,y);
});
canvas.addEventListener('mousemove',e=>{
  if(!isTouching) return;
  touchCurrent={x:e.clientX,y:e.clientY};
  if(state===STATE.PLAYING && !miningTarget){
    player.tx=touchCurrent.x;
    player.ty=touchCurrent.y;
  }
});
canvas.addEventListener('mouseup',e=>{
  isTouching=false;touchStart=null;touchCurrent=null;
  miningTarget=null;miningProgress=0;
});

function checkMiningTap(x,y){
  for(let a of asteroids){
    if(dist({x,y},a)<a.radius+20){
      if(dist(player,a)<a.radius+60){
        miningTarget=a;miningProgress=0;
        return;
      }else{
        // Move toward asteroid
        player.tx=a.x;player.ty=a.y;
      }
    }
  }
}

// --- Base UI ---
let baseScroll=0;
function handleBaseTouch(x,y){
  let w=W(),h=H();
  // Sell button
  if(y>h*0.12&&y<h*0.2&&x>w*0.05&&x<w*0.45){
    sellAll();return;
  }
  // Leave button
  if(y>h*0.12&&y<h*0.2&&x>w*0.55&&x<w*0.95){
    state=STATE.PLAYING;baseCooldown=60;return;
  }
  // Upgrade buttons
  let startY=h*0.34;
  let cardH=h*0.12;
  for(let i=0;i<UPGRADE_DEFS.length;i++){
    let uy=startY+i*(h*0.14);
    let btnX=w*0.65,btnY=uy+cardH*0.35,btnW=w*0.28,btnH=cardH*0.45;
    if(x>btnX&&x<btnX+btnW&&y>btnY&&y<btnY+btnH){
      buyUpgrade(i);return;
    }
  }
}

function sellAll(){
  let total=0;
  for(let key in cargoItems){
    let type=RES_TYPES.find(t=>t.id===key);
    total+=cargoItems[key]*type.value;
    cargoItems[key]=0;
  }
  if(total>0){
    credits+=total;cargo=0;
    updateMissions('sell',null,total);
    // Restore 20% of max HP on sell
    let healed=Math.floor(player.maxHp*0.2);
    player.hp=Math.min(player.hp+healed,player.maxHp);
    showNotify('出售成功！+'+total+' 信用币 | +'+healed+' HP');
    score+=total;
  }
}

function buyUpgrade(idx){
  let u=UPGRADE_DEFS[idx];
  let lv=upgrades[u.id];
  if(lv>=u.levels){showNotify('已满级！');return;}
  let cost=Math.floor(u.baseCost*Math.pow(u.costMul,lv));
  if(credits<cost){showNotify('信用币不足！');return;}
  credits-=cost;
  upgrades[u.id]++;
  applyUpgrades();
  // Heal to new max HP when upgrading shield
  if(u.id==='shield') player.hp=player.maxHp;
  showNotify(u.name+' 升级到 Lv.'+(lv+1)+'!');
}

// --- Update ---
function update(){
  if(state!==STATE.PLAYING) return;
  gameTime++;
  dayTime=(dayTime+0.0002)%1;

  // Survive mission
  if(gameTime%60===0) updateMissions('survive',null,1);

  // Level up
  let newLevel=1+Math.floor(gameTime/1800);
  if(newLevel>level){
    level=newLevel;
    showNotify('难度提升！等级 '+level);
  }

  // Player movement
  let dx=player.tx-player.x, dy=player.ty-player.y;
  let d=Math.hypot(dx,dy);
  if(d>5){
    let spd=Math.min(player.moveSpeed,d*0.08);
    player.x+=dx/d*spd;
    player.y+=dy/d*spd;
    player.angle=Math.atan2(dy,dx);
    // Trail
    player.trail.push({x:player.x,y:player.y,life:20});
  }
  player.x=clamp(player.x,15,W()-15);
  player.y=clamp(player.y,15,H()-15);
  if(player.trail.length>30) player.trail.shift();
  for(let t of player.trail) t.life--;
  player.trail=player.trail.filter(t=>t.life>0);

  if(player.invuln>0) player.invuln--;
  if(baseCooldown>0) baseCooldown--;

  // Check base proximity
  if(baseCooldown<=0 && dist(player,baseStation)<baseStation.radius+25){
    state=STATE.BASE;
    cleanMissions();
    return;
  }

  // Mining
  if(miningTarget && isTouching){
    if(dist(player,miningTarget)<miningTarget.radius+60){
      if(cargo<player.maxCargo){
        miningProgress+=player.mineSpeed*0.02;
        // Particles during mining
        if(gameTime%5===0){
          emitParticles(miningTarget.x,miningTarget.y,miningTarget.type.color,1,1.5,15);
        }
        if(miningProgress>=1){
          // Mined!
          cargoItems[miningTarget.type.id]++;
          cargo++;
          score+=miningTarget.type.value;
          updateMissions('mine',miningTarget.type.id,1);
          emitParticles(miningTarget.x,miningTarget.y,miningTarget.type.color,12,3,30);
          showNotify('+1 '+miningTarget.type.name);
          asteroids=asteroids.filter(a=>a!==miningTarget);
          miningTarget=null;miningProgress=0;
        }
      } else {
        showNotify('货舱已满！');
        miningTarget=null;miningProgress=0;
      }
    } else {
      player.tx=miningTarget.x;
      player.ty=miningTarget.y;
    }
  }

  // Asteroid rotation
  for(let a of asteroids){a.rot+=a.rotSpeed;}

  // Respawn asteroids
  if(asteroids.length<8+level*2 && gameTime%120===0){
    spawnAsteroids(randInt(1,3));
  }

  // Spawn hazards
  if(gameTime%Math.max(30,90-level*8)===0 && Math.random()<Math.min(0.4+level*0.05,0.95)){
    spawnMeteor();
  }
  if(gameTime%Math.max(120,400-level*30)===0 && Math.random()<Math.min(0.3+level*0.04,0.95)){
    spawnPirate();
  }
  if(gameTime%Math.max(300,900-level*60)===0 && Math.random()<Math.min(0.15+level*0.03,0.95)){
    spawnBlackhole();
  }

  // Night = more hazards
  if(dayTime>0.5&&dayTime<0.8){
    if(gameTime%60===0&&Math.random()<0.3) spawnMeteor();
  }

  // Meteors
  for(let m of meteors){
    m.x+=Math.cos(m.angle)*m.speed;
    m.y+=Math.sin(m.angle)*m.speed;
    m.trail.push({x:m.x,y:m.y,life:10});
    if(m.trail.length>8) m.trail.shift();
    for(let t of m.trail) t.life--;
    m.trail=m.trail.filter(t=>t.life>0);
    // Hit player
    if(dist(m,player)<m.radius+12 && player.invuln<=0){
      damagePlayer(m.damage);
      emitParticles(m.x,m.y,'#ff6633',8,3,20);
      m.dead=true;
    }
  }
  meteors=meteors.filter(m=>!m.dead&&m.x>-50&&m.x<W()+50&&m.y>-50&&m.y<H()+50);

  // Pirates AI
  for(let p of pirates){
    let dx=player.x-p.x, dy=player.y-p.y;
    let d=Math.hypot(dx,dy);
    p.angle=Math.atan2(dy,dx);
    // Chase player but keep some distance
    if(d>80){
      p.x+=dx/d*p.speed;
      p.y+=dy/d*p.speed;
    } else if(d<50){
      p.x-=dx/d*p.speed*0.5;
      p.y-=dy/d*p.speed*0.5;
    }
    // Trail
    p.trail.push({x:p.x,y:p.y,life:12});
    if(p.trail.length>10) p.trail.shift();
    for(let t of p.trail) t.life--;
    p.trail=p.trail.filter(t=>t.life>0);
    // Fire
    p.fireCooldown--;
    if(p.fireCooldown<=0 && d<300){
      p.fireCooldown=Math.max(30,p.fireRate);
      bullets.push({x:p.x,y:p.y,angle:p.angle,speed:4,damage:p.damage,
        fromPirate:true,life:180});
    }
    // Collision with player
    if(dist(p,player)<p.radius+12 && player.invuln<=0){
      damagePlayer(15);
      p.hp-=20;
      emitParticles(player.x,player.y,'#ff4444',6,2,15);
    }
    if(p.hp<=0){
      emitParticles(p.x,p.y,'#ff3300',20,4,30);
      updateMissions('kill',null,1);
      credits+=20+level*10;
      score+=50;
      showNotify('消灭海盗！+'+( 20+level*10)+' 信用币');
      p.dead=true;
    }
  }
  pirates=pirates.filter(p=>!p.dead);

  // Bullets
  for(let b of bullets){
    b.x+=Math.cos(b.angle)*b.speed;
    b.y+=Math.sin(b.angle)*b.speed;
    b.life--;
    if(b.fromPirate && dist(b,player)<14 && player.invuln<=0){
      damagePlayer(b.damage);
      b.dead=true;
      emitParticles(b.x,b.y,'#ff0',4,2,10);
    }
    // Player bullets hit pirates
    if(!b.fromPirate){
      for(let p of pirates){
        if(dist(b,p)<p.radius+5){
          p.hp-=b.damage;
          b.dead=true;
          emitParticles(b.x,b.y,'#ff8800',4,2,10);
        }
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead&&b.life>0&&b.x>-20&&b.x<W()+20&&b.y>-20&&b.y<H()+20);

  // Player auto-shoot at nearest pirate
  if(gameTime%Math.max(15,40-upgrades.laser*5)===0 && pirates.length>0){
    let nearest=null, nd=Infinity;
    for(let p of pirates){
      let d=dist(p,player);
      if(d<250 && d<nd){nd=d;nearest=p;}
    }
    if(nearest){
      let a=Math.atan2(nearest.y-player.y,nearest.x-player.x);
      bullets.push({x:player.x,y:player.y,angle:a,speed:6,damage:10+upgrades.laser*5,
        fromPirate:false,life:120});
    }
  }

  // Black holes
  for(let bh of blackholes){
    bh.rot+=0.03;
    bh.lifetime--;
    let d=dist(bh,player);
    if(d<bh.pullRadius){
      let pull=bh.strength*(1-d/bh.pullRadius);
      let a=Math.atan2(bh.y-player.y,bh.x-player.x);
      player.x+=Math.cos(a)*pull*2;
      player.y+=Math.sin(a)*pull*2;
      if(d<bh.radius){
        damagePlayer(2);
      }
    }
    // Pull asteroids too
    let asteroidsToRemove=[];
    for(let a of asteroids){
      let da=dist(bh,a);
      if(da<bh.pullRadius*0.7){
        let pull=bh.strength*0.5*(1-da/(bh.pullRadius*0.7));
        let ang=Math.atan2(bh.y-a.y,bh.x-a.x);
        a.x+=Math.cos(ang)*pull;
        a.y+=Math.sin(ang)*pull;
        if(da<bh.radius){
          asteroidsToRemove.push(a);
        }
      }
    }
    if(asteroidsToRemove.length>0){
      asteroids=asteroids.filter(a=>!asteroidsToRemove.includes(a));
    }
    if(bh.lifetime<=0) bh.dead=true;
  }
  blackholes=blackholes.filter(bh=>!bh.dead);

  // Particles
  for(let p of particles){
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.95; p.vy*=0.95;
    p.life--;
  }
  particles=particles.filter(p=>p.life>0);

  // Shake
  if(shakeTimer>0) shakeTimer--;

  // Notify
  if(notifyTimer>0) notifyTimer--;

  // Check game over
  if(player.hp<=0){
    state=STATE.GAMEOVER;
    emitParticles(player.x,player.y,'#ff4400',40,5,40);
  }
}

function damagePlayer(dmg){
  if(player.invuln>0) return;
  player.hp-=dmg;
  player.invuln=30;
  shakeTimer=10;shakeIntensity=4;
  emitParticles(player.x,player.y,'#ff2200',5,2,15);
}

// --- Draw ---
function draw(){
  let w=W(), h=H();
  ctx.save();
  // Shake
  if(shakeTimer>0){
    ctx.translate(rand(-shakeIntensity,shakeIntensity),rand(-shakeIntensity,shakeIntensity));
  }

  // Background - day/night
  let nightFactor=0;
  if(dayTime>0.4&&dayTime<0.9){
    nightFactor=dayTime<0.65?((dayTime-0.4)/0.25):((0.9-dayTime)/0.25);
  }
  let bgR=Math.floor(lerp(8,2,nightFactor));
  let bgG=Math.floor(lerp(10,3,nightFactor));
  let bgB=Math.floor(lerp(20,12,nightFactor));
  ctx.fillStyle=`rgb(${bgR},${bgG},${bgB})`;
  ctx.fillRect(0,0,w,h);

  // Stars (parallax)
  for(let s of stars){
    let sx=(s.x+gameTime*s.speed*0.1)%w;
    let sy=(s.y+gameTime*s.speed*0.05)%h;
    let bright=s.bright*(1-nightFactor*0.3);
    ctx.fillStyle=`rgba(255,255,255,${bright})`;
    ctx.beginPath();
    ctx.arc(sx,sy,s.size,0,Math.PI*2);
    ctx.fill();
  }

  if(state===STATE.MENU){drawMenu();ctx.restore();return;}
  if(state===STATE.GAMEOVER){drawGameOver();ctx.restore();return;}
  if(state===STATE.BASE){drawBase();ctx.restore();return;}

  // Base station
  drawBaseStation();

  // Black holes
  for(let bh of blackholes) drawBlackhole(bh);

  // Asteroids
  for(let a of asteroids) drawAsteroid(a);

  // Mining progress
  if(miningTarget && miningProgress>0){
    let mt=miningTarget;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(mt.x-25,mt.y-mt.radius-18,50,8);
    ctx.fillStyle='#00ff88';
    ctx.fillRect(mt.x-25,mt.y-mt.radius-18,50*miningProgress,8);
    ctx.strokeStyle='#00ff88';
    ctx.strokeRect(mt.x-25,mt.y-mt.radius-18,50,8);
    // Laser beam
    ctx.strokeStyle=`rgba(0,255,200,${0.5+Math.random()*0.5})`;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(player.x,player.y);
    ctx.lineTo(mt.x+rand(-3,3),mt.y+rand(-3,3));
    ctx.stroke();
    ctx.lineWidth=1;
  }

  // Meteors
  for(let m of meteors) drawMeteor(m);

  // Bullets
  for(let b of bullets){
    ctx.fillStyle=b.fromPirate?'#ff4444':'#44ff88';
    ctx.beginPath();
    ctx.arc(b.x,b.y,3,0,Math.PI*2);
    ctx.fill();
  }

  // Pirates
  for(let p of pirates) drawPirate(p);

  // Player
  drawPlayer();

  // Particles
  for(let p of particles){
    let alpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.globalAlpha=alpha;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // HUD
  drawHUD();

  // Mini-map
  drawMinimap();

  // Day indicator
  drawDayIndicator();

  ctx.restore();
}

function drawPlayer(){
  let p=player;
  // Trail
  for(let i=0;i<p.trail.length;i++){
    let t=p.trail[i];
    let alpha=t.life/20*0.4;
    ctx.fillStyle=`rgba(100,180,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(t.x,t.y,4*(t.life/20),0,Math.PI*2);
    ctx.fill();
  }
  // Ship
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.angle);
  // Flash when invulnerable
  if(p.invuln>0 && Math.floor(p.invuln/4)%2===0){
    ctx.globalAlpha=0.4;
  }
  // Engine glow
  ctx.fillStyle='rgba(50,150,255,0.6)';
  ctx.beginPath();
  ctx.moveTo(-12,-5);
  ctx.lineTo(-18-Math.random()*6,0);
  ctx.lineTo(-12,5);
  ctx.fill();
  // Body
  ctx.fillStyle='#ddeeff';
  ctx.strokeStyle='#88bbff';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(16,0);
  ctx.lineTo(-10,-9);
  ctx.lineTo(-6,0);
  ctx.lineTo(-10,9);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Shield glow
  if(upgrades.shield>0){
    ctx.strokeStyle=`rgba(100,200,255,${0.15+upgrades.shield*0.05})`;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,0,18,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a){
  ctx.save();
  ctx.translate(a.x,a.y);
  ctx.rotate(a.rot);
  ctx.fillStyle=a.type.color;
  ctx.strokeStyle='rgba(255,255,255,0.2)';
  ctx.lineWidth=1;
  ctx.beginPath();
  let n=a.verts.length;
  for(let i=0;i<n;i++){
    let angle=(Math.PI*2/n)*i;
    let r=a.radius*a.verts[i];
    let vx=Math.cos(angle)*r, vy=Math.sin(angle)*r;
    if(i===0) ctx.moveTo(vx,vy); else ctx.lineTo(vx,vy);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Highlight
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.arc(-a.radius*0.2,-a.radius*0.2,a.radius*0.35,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawBaseStation(){
  let b=baseStation;
  // Glow
  let glow=ctx.createRadialGradient(b.x,b.y,b.radius*0.5,b.x,b.y,b.radius*2);
  glow.addColorStop(0,'rgba(0,255,100,0.15)');
  glow.addColorStop(1,'rgba(0,255,100,0)');
  ctx.fillStyle=glow;
  ctx.fillRect(b.x-b.radius*2,b.y-b.radius*2,b.radius*4,b.radius*4);
  // Structure
  ctx.fillStyle='#115522';
  ctx.strokeStyle='#33ff66';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
  ctx.fill();ctx.stroke();
  // Inner ring
  ctx.strokeStyle='#44ff88';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.radius*0.6,0,Math.PI*2);
  ctx.stroke();
  // Cross
  ctx.beginPath();
  ctx.moveTo(b.x-b.radius*0.4,b.y);ctx.lineTo(b.x+b.radius*0.4,b.y);
  ctx.moveTo(b.x,b.y-b.radius*0.4);ctx.lineTo(b.x,b.y+b.radius*0.4);
  ctx.stroke();
  // Label
  ctx.fillStyle='#44ff88';
  ctx.font='11px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('基地',b.x,b.y+b.radius+16);
}

function drawMeteor(m){
  for(let i=0;i<m.trail.length;i++){
    let t=m.trail[i];
    ctx.fillStyle=`rgba(255,100,30,${t.life/10*0.5})`;
    ctx.beginPath();
    ctx.arc(t.x,t.y,m.radius*0.5*(t.life/10),0,Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle='#aa5533';
  ctx.strokeStyle='#ff8844';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.arc(m.x,m.y,m.radius,0,Math.PI*2);
  ctx.fill();ctx.stroke();
}

function drawPirate(p){
  // Trail
  for(let t of p.trail){
    ctx.fillStyle=`rgba(255,50,50,${t.life/12*0.3})`;
    ctx.beginPath();
    ctx.arc(t.x,t.y,4*(t.life/12),0,Math.PI*2);
    ctx.fill();
  }
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.angle);
  // Engine
  ctx.fillStyle='rgba(255,80,20,0.6)';
  ctx.beginPath();
  ctx.moveTo(-10,-4);ctx.lineTo(-15-Math.random()*4,0);ctx.lineTo(-10,4);
  ctx.fill();
  // Body
  ctx.fillStyle='#cc2222';
  ctx.strokeStyle='#ff4444';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(14,0);ctx.lineTo(-8,-8);ctx.lineTo(-4,0);ctx.lineTo(-8,8);
  ctx.closePath();
  ctx.fill();ctx.stroke();
  ctx.restore();
  // HP bar
  if(p.hp<p.maxHp){
    let bw=24;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(p.x-bw/2,p.y-p.radius-10,bw,4);
    ctx.fillStyle='#ff3333';
    ctx.fillRect(p.x-bw/2,p.y-p.radius-10,bw*(p.hp/p.maxHp),4);
  }
}

function drawBlackhole(bh){
  // Pull radius indicator
  ctx.strokeStyle='rgba(100,0,200,0.1)';
  ctx.lineWidth=1;
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.arc(bh.x,bh.y,bh.pullRadius,0,Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
  // Swirl
  ctx.save();
  ctx.translate(bh.x,bh.y);
  for(let i=0;i<4;i++){
    let a=bh.rot+i*Math.PI/2;
    let grad=ctx.createRadialGradient(0,0,bh.radius*0.2,0,0,bh.radius);
    grad.addColorStop(0,'rgba(50,0,80,0.8)');
    grad.addColorStop(1,'rgba(80,0,160,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(0,0,bh.radius,a,a+Math.PI/3);
    ctx.lineTo(0,0);
    ctx.fill();
  }
  // Core
  ctx.fillStyle='#110022';
  ctx.beginPath();
  ctx.arc(0,0,bh.radius*0.4,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='rgba(150,50,255,0.5)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(0,0,bh.radius*0.5,bh.rot,bh.rot+Math.PI);
  ctx.stroke();
  ctx.restore();
}

function drawBase(){

  for(let s of stars){
    ctx.fillStyle=`rgba(255,255,255,${s.bright*0.5})`;

  // Cargo contents
  ctx.font='12px sans-serif';
  ctx.textAlign='left';
  let cy=h*0.22;
  ctx.fillStyle='#aabbcc';
  ctx.fillText('货舱内容:',w*0.05,cy);
  // Grid layout
  ctx.textAlign='left';
  for(let i=0;i<RES_TYPES.length;i++){
    let rt=RES_TYPES[i];
    let amt=cargoItems[rt.id];
    let rx=w*0.05+(i%2)*w*0.48;
    let ry=h*0.24+Math.floor(i/2)*18;
    ctx.fillStyle=rt.color;
    ctx.fillText(rt.name+':'+amt+' (值'+(amt*rt.value)+')',rx,ry);
  }

  // Upgrades
  ctx.fillStyle='#88bbff';
  ctx.font='bold 16px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('升级系统',w/2,h*0.31);

  let startY=h*0.34;
  for(let i=0;i<UPGRADE_DEFS.length;i++){
    let u=UPGRADE_DEFS[i];
    let lv=upgrades[u.id];
    let cost=Math.floor(u.baseCost*Math.pow(u.costMul,lv));
    let uy=startY+i*(h*0.14);
    let cardH=h*0.12;

    // Card bg
    ctx.fillStyle='rgba(20,40,70,0.6)';
    ctx.fillRect(w*0.04,uy,w*0.92,cardH);
    ctx.strokeStyle='rgba(50,150,255,0.3)';
    ctx.lineWidth=1;
    ctx.strokeRect(w*0.04,uy,w*0.92,cardH);

    // Name & level
    ctx.font='bold 14px sans-serif';
    ctx.fillStyle='#ddeeff';
    ctx.textAlign='left';
    ctx.fillText(u.name+' Lv.'+lv+'/'+u.levels,w*0.08,uy+cardH*0.35);

    // Desc
    ctx.font='11px sans-serif';
    ctx.fillStyle='#8899aa';
    ctx.fillText(u.desc,w*0.08,uy+cardH*0.6);

    // Current stat
    let curVal=u.baseVal+u.perLevel*lv;
    let nextVal=lv<u.levels?(u.baseVal+u.perLevel*(lv+1)):curVal;
    ctx.fillStyle='#66ddff';
    ctx.fillText(curVal.toFixed(1)+(lv<u.levels?' → '+nextVal.toFixed(1):''),w*0.08,uy+cardH*0.85);

    // Level dots
    for(let j=0;j<u.levels;j++){
      ctx.fillStyle=j<lv?'#44ff88':'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(w*0.5+j*14,uy+cardH*0.35,4,0,Math.PI*2);
      ctx.fill();
    }

    // Buy button
    let btnX=w*0.65, btnY=uy+cardH*0.35, btnW=w*0.28, btnBH=cardH*0.45;
    if(lv<u.levels){
      let canBuy=credits>=cost;
      ctx.fillStyle=canBuy?'rgba(0,180,80,0.3)':'rgba(80,80,80,0.3)';
      ctx.fillRect(btnX,btnY,btnW,btnBH);
      ctx.strokeStyle=canBuy?'#33ff66':'#555';
      ctx.strokeRect(btnX,btnY,btnW,btnBH);
      ctx.fillStyle=canBuy?'#44ff88':'#666';
      ctx.font='bold 12px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('升级 $'+cost,btnX+btnW/2,btnY+btnBH*0.7);
    } else {
      ctx.fillStyle='rgba(255,200,0,0.2)';
      ctx.fillRect(btnX,btnY,btnW,btnBH);
      ctx.strokeStyle='#ffcc00';
      ctx.strokeRect(btnX,btnY,btnW,btnBH);
      ctx.fillStyle='#ffcc00';
      ctx.font='bold 12px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('已满级',btnX+btnW/2,btnY+btnBH*0.7);
    }
  }

  // Missions
  let missionY=startY+UPGRADE_DEFS.length*(h*0.14)+10;
  if(missionY<h-60){
    ctx.fillStyle='#88bbff';
    ctx.font='bold 14px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('当前任务',w/2,missionY);
    ctx.font='12px sans-serif';
    ctx.textAlign='left';
    for(let i=0;i<missions.length;i++){
      let m=missions[i];
      let prog=Math.min(m.progress,m.target);
      ctx.fillStyle=m.completed?'#44ff88':'#aabbcc';
      ctx.fillText((m.completed?'✓ ':'')+m.desc+' ('+prog+'/'+m.target+') 奖励:'+m.reward,
        w*0.08,missionY+20+i*18);
    }
  }

  // Notification
  if(notifyTimer>0){
    let alpha=Math.min(1,notifyTimer/30);
    ctx.fillStyle=`rgba(0,255,150,${alpha})`;
    ctx.font='bold 16px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(notification,w/2,h*0.95);
  }
}

// --- Game Loop ---
let lastTime=0;
function gameLoop(ts){
  let dt=ts-lastTime;
  lastTime=ts;
  // Update particles even in non-playing states
  if(state===STATE.GAMEOVER){
    for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life--;}
    particles=particles.filter(p=>p.life>0);
  }
  if(state===STATE.PLAYING) update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Init stars for menu
initStars();
initBase();
requestAnimationFrame(gameLoop);
</script>
