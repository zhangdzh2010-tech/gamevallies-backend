name: Deploy to Alibaba FC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aliyun-fc-production-backend
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.ALIYUN_FC_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - name: Validate registry configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_REGISTRY:?Missing ACR_REGISTRY}" "${ACR_NAMESPACE:?Missing ACR_NAMESPACE}"
          : "${ACR_USERNAME:?Missing ACR_USERNAME}" "${ACR_PASSWORD:?Missing ACR_PASSWORD}"
          [[ "$ACR_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$ACR_NAMESPACE" =~ ^[a-z0-9_-]+$ ]]
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable release images
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
          for service in user-service game-service social-service feed-service; do
            docker buildx build --platform linux/amd64 --build-arg SERVICE="$service" --tag "$ACR_REGISTRY/$ACR_NAMESPACE/$service:$GITHUB_SHA" --push .
          done
          docker buildx build --platform linux/amd64 -f packages/ai-engine/Dockerfile --tag "$ACR_REGISTRY/$ACR_NAMESPACE/ai-engine:$GITHUB_SHA" --push .
          docker buildx build --platform linux/amd64 -f deploy/fc/Dockerfile.gateway --tag "$ACR_REGISTRY/$ACR_NAMESPACE/gateway:$GITHUB_SHA" --push .
  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      FC_ACCOUNT_ID: ${{ vars.FC_ACCOUNT_ID }}
      FC_REGION: ${{ vars.FC_REGION }}
      FC_PREFIX: ${{ vars.FC_PREFIX }}
      FC_EXECUTION_ROLE: ${{ vars.FC_EXECUTION_ROLE }}
      FC_FRONTEND_URL: ${{ vars.FC_FRONTEND_URL }}
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      ACR_INSTANCE_ID: ${{ vars.ACR_INSTANCE_ID }}
      IMAGE_TAG: ${{ github.sha }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      ALIBABA_CLOUD_SECURITY_TOKEN: ${{ secrets.ALIBABA_CLOUD_SECURITY_TOKEN }}
      FC_RUNTIME_JSON: ${{ secrets.FC_RUNTIME_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/fc/requirements.txt
      - name: Validate and deploy FC functions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          printf '%s' "$FC_RUNTIME_JSON" > "$config"
          python scripts/fc/deploy.py validate --runtime "$config"
          python scripts/fc/deploy.py apply --runtime "$config" --release fc-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: fc-release-${{ github.sha }}
          path: fc-release.json
          if-no-files-found: error
          retention-days: 90
