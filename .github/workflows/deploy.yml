name: 部署到火山引擎函数服务（容器镜像）

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VOLCENGINE_REGION:             cn-shanghai
  VOLCENGINE_VPC_ID:             vpc-7uh247krgohs72200skd7y04
  VOLCENGINE_SUBNET_ID:          subnet-33guvcwoe43y86k70bqnvis8n
  VOLCENGINE_REGISTRY:           gamevallies-repo-cn-shanghai.cr.volces.com
  VOLCENGINE_REGISTRY_NAMESPACE: gamevallies
  # VOLCENGINE_SECURITY_GROUP_ID: sg-xxxxxxxxxx  # 填写后自动绑定 VPC

jobs:
  build-and-deploy:
    name: 构建镜像 & 部署
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ── Docker 环境 ──────────────────────────────────────────────────────
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录火山引擎容器镜像服务 (VCR)
        run: |
          echo "${{ secrets.VOLCENGINE_REGISTRY_PASSWORD }}" | \
            docker login ${{ env.VOLCENGINE_REGISTRY }} \
              -u "${{ secrets.VOLCENGINE_REGISTRY_USERNAME }}" \
              --password-stdin

      # ── 构建并推送各服务镜像 ─────────────────────────────────────────────
      - name: 构建并推送 user-service
        run: |
          IMAGE=${{ env.VOLCENGINE_REGISTRY }}/${{ env.VOLCENGINE_REGISTRY_NAMESPACE }}/gv-user-service:${{ github.sha }}
          docker build --platform linux/amd64 --build-arg SERVICE=user-service --build-arg PORT=3001 -t $IMAGE .
          docker push $IMAGE

      - name: 构建并推送 game-service
        run: |
          IMAGE=${{ env.VOLCENGINE_REGISTRY }}/${{ env.VOLCENGINE_REGISTRY_NAMESPACE }}/gv-game-service:${{ github.sha }}
          docker build --platform linux/amd64 --build-arg SERVICE=game-service --build-arg PORT=3002 -t $IMAGE .
          docker push $IMAGE

      - name: 构建并推送 social-service
        run: |
          IMAGE=${{ env.VOLCENGINE_REGISTRY }}/${{ env.VOLCENGINE_REGISTRY_NAMESPACE }}/gv-social-service:${{ github.sha }}
          docker build --platform linux/amd64 --build-arg SERVICE=social-service --build-arg PORT=3003 -t $IMAGE .
          docker push $IMAGE

      - name: 构建并推送 feed-service
        run: |
          IMAGE=${{ env.VOLCENGINE_REGISTRY }}/${{ env.VOLCENGINE_REGISTRY_NAMESPACE }}/gv-feed-service:${{ github.sha }}
          docker build --platform linux/amd64 --build-arg SERVICE=feed-service --build-arg PORT=3004 -t $IMAGE .
          docker push $IMAGE

      # ── 部署到 VeFaaS ────────────────────────────────────────────────────
      - name: 配置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 安装部署依赖
        run: pip install volcengine-python-sdk

      - name: 部署所有服务到火山引擎函数服务
        env:
          VOLCENGINE_ACCESS_KEY:         ${{ secrets.VOLCENGINE_ACCESS_KEY }}
          VOLCENGINE_SECRET_KEY:         ${{ secrets.VOLCENGINE_SECRET_KEY }}
          VOLCENGINE_REGION:             ${{ env.VOLCENGINE_REGION }}
          VOLCENGINE_REGISTRY:            ${{ env.VOLCENGINE_REGISTRY }}
          VOLCENGINE_REGISTRY_NAMESPACE:  ${{ env.VOLCENGINE_REGISTRY_NAMESPACE }}
          VOLCENGINE_REGISTRY_USERNAME:   ${{ secrets.VOLCENGINE_REGISTRY_USERNAME }}
          VOLCENGINE_REGISTRY_PASSWORD:   ${{ secrets.VOLCENGINE_REGISTRY_PASSWORD }}
          IMAGE_TAG:                      ${{ github.sha }}
          VOLCENGINE_VPC_ID:             ${{ env.VOLCENGINE_VPC_ID }}
          VOLCENGINE_SUBNET_ID:          ${{ env.VOLCENGINE_SUBNET_ID }}
          VOLCENGINE_SECURITY_GROUP_ID:  ${{ secrets.VOLCENGINE_SECURITY_GROUP_ID }}
          DATABASE_URL:                  ${{ secrets.DATABASE_URL }}
          REDIS_URL:                     ${{ secrets.REDIS_URL }}
          JWT_SECRET:                    ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET:            ${{ secrets.JWT_REFRESH_SECRET }}
          CORS_ORIGIN:                   ${{ secrets.CORS_ORIGIN }}
          USER_SERVICE_URL:              ${{ secrets.USER_SERVICE_URL }}
          GAME_SERVICE_URL:              ${{ secrets.GAME_SERVICE_URL }}
          FEED_SERVICE_URL:              ${{ secrets.FEED_SERVICE_URL }}
          PUBLIC_API_BASE_URL:           ${{ secrets.PUBLIC_API_BASE_URL }}
          GAME_SERVICE_UPSTREAM_URL:     ${{ secrets.GAME_SERVICE_UPSTREAM_URL }}
          FEED_SERVICE_UPSTREAM_URL:     ${{ secrets.FEED_SERVICE_UPSTREAM_URL }}
          AI_ENGINE_URL:                 ${{ secrets.AI_ENGINE_URL }}
          WECHAT_MINIAPP_APP_ID:         ${{ secrets.WECHAT_MINIAPP_APP_ID }}
          WECHAT_MINIAPP_APP_SECRET:     ${{ secrets.WECHAT_MINIAPP_APP_SECRET }}
        run: python scripts/deploy.py
