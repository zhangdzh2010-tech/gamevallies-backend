name: Deploy to Alibaba Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aliyun-production-backend
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.ALIYUN_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - name: Validate registry configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_REGISTRY:?Missing ACR_REGISTRY}" "${ACR_NAMESPACE:?Missing ACR_NAMESPACE}"
          : "${ACR_USERNAME:?Missing ACR_USERNAME}" "${ACR_PASSWORD:?Missing ACR_PASSWORD}"
          [[ "$ACR_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$ACR_NAMESPACE" =~ ^[a-z0-9_-]+$ ]]
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable release images
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
          for service in user-service game-service social-service feed-service; do
            docker buildx build --platform linux/amd64 --build-arg SERVICE="$service" --tag "$ACR_REGISTRY/$ACR_NAMESPACE/$service:$GITHUB_SHA" --push .
          done
          docker buildx build --platform linux/amd64 -f packages/ai-engine/Dockerfile --tag "$ACR_REGISTRY/$ACR_NAMESPACE/ai-engine:$GITHUB_SHA" --push .
          docker buildx build --platform linux/amd64 -f deploy/aliyun/Dockerfile.gateway --tag "$ACR_REGISTRY/$ACR_NAMESPACE/gateway:$GITHUB_SHA" --push .
  deploy:
    needs: images
    # Only a dedicated production ECS runner may use this label.
    runs-on: [self-hosted, Linux, X64, aliyun-ecs-backend]
    environment: production
    timeout-minutes: 20
    env:
      DEPLOY_ROOT: /opt/gamevallies/backend
      IMAGE_PREFIX: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}
      IMAGE_TAG: ${{ github.sha }}
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_PULL_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PULL_PASSWORD }}
      GATEWAY_BIND: ${{ vars.GATEWAY_BIND }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull and deploy on ECS
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_USERNAME:?Missing ACR_PULL_USERNAME}" "${ACR_PASSWORD:?Missing ACR_PULL_PASSWORD}"
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
          bash scripts/aliyun/deploy.sh
