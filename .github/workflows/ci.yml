name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: migration-ci-only
          MYSQL_DATABASE: gamevallies
          MYSQL_USER: gamevallies_app
          MYSQL_PASSWORD: migration-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://gamevallies_app:migration-ci-only@127.0.0.1:3306/gamevallies
      MIGRATION_TEST_ALLOW_LOCAL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: node --test test/database-migration.test.cjs
      - name: Verify empty and repeated database initialization on MySQL 8
        run: node test/database-migration.integration.cjs
      - name: Build shared user service for quota integration
        run: npm run build --workspace=@gamevallies/user-service
      - name: Verify concurrent creation quota grants on MySQL 8
        run: node test/creation-quota-grant.integration.cjs

  game-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://test:test@localhost:3306/refactor_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test deploy/fc/internal-auth.test.cjs deploy/fc/task-drain.test.cjs
      - run: npx prisma generate
      - run: npm run build --workspaces
      - name: Verify consolidated API routes and authentication
        run: node --test test/unified-api.test.cjs
      - name: Verify generation and session regressions
        run: >-
          npm test --workspace=game-service -- --runInBand
          test/interactive-quality.spec.ts
          test/game.service.spec.ts
          test/game-locking.spec.ts
          test/creation-session.service.spec.ts
          test/game-schema-bootstrap.service.spec.ts
          test/admin.service.spec.ts
          test/llm-business-config.spec.ts
          test/llm-readiness.spec.ts
          test/admin-assets.spec.ts
          test/generation-task.service.spec.ts
          test/subscription-grant.service.spec.ts
          test/creation-quota-grant.service.spec.ts
          test/admin-quota-grants-ui.spec.ts
          test/timeout-admin-catalog.spec.ts
          test/growth.service.spec.ts
      - name: Verify production feed query
        run: npm test --workspace=@gamevallies/feed-service -- --runInBand test/trending-production.spec.ts

  ai-engine:
    # Playwright 1.43 uses the Ubuntu 22.04 system dependency names.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/ai-engine/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Isolate browser dependencies from the optional Chrome apt repository
        # Playwright downloads its pinned Chromium itself. A stale Google apt
        # index must not break installation of Ubuntu system libraries.
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -Eq 'https?://dl\.google\.com/linux/chrome(-stable)?/deb' "$source"; then
              echo "Disabling optional Chrome repository: $(basename "$source")"
              sudo mv "$source" "$RUNNER_TEMP/$(basename "$source").disabled"
            fi
          done
      - run: python -m playwright install --with-deps chromium
      - run: python ../../scripts/sync-quality-policy.py --check
      - run: python ../../scripts/sync-llm-routing-policy.py --check
      - name: Verify configured LLM repair timeouts
        run: python -m pytest -q tests/test_qa_pipeline.py -k timeout
      - name: Verify pipeline, prompts and quality repairs
        run: >-
          python -m pytest -q
          tests/test_durable_task_executor.py
          tests/test_async_task_idempotency_and_store.py
          tests/test_async_task_api.py
          tests/test_model_transport.py
          tests/test_llm_gateway.py
          tests/test_llm_readiness.py
          tests/test_llm_client.py
          tests/test_llm_http_evidence.py
          tests/test_interactive_creation.py
          tests/test_interactive_contract_probes.py
          tests/test_storage_api_detection.py
          tests/test_interactive_repair.py
          tests/test_generation_failure_evidence.py
          tests/test_artifact_quality.py
          tests/test_pipeline_v2_runner.py
          tests/test_prompt_bundle_resolver.py
          tests/test_prompt_integration.py
          tests/test_generation_v1_localization.py
          tests/test_quality_gate_patch_repair.py
          tests/test_create_progress_and_parallel_qa.py
          tests/test_dialogue_engine.py
          tests/test_dialogue_engine_json_repair.py
          tests/test_code_preflight.py
          tests/test_code_generator.py
          tests/test_code_reviewer.py
          tests/test_quality_scorer.py
          tests/test_section_patch.py
          tests/test_runtime_qa.py
          tests/test_creative_design.py
          tests/test_runtime_isolation.py
          tests/test_fc_runtime.py

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/fc/requirements.txt
      - run: python scripts/fc/test_deploy.py
      - run: python scripts/fc/test_configure.py
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify FC ZIP packages without cloud credentials
        env:
          CONTENT_ORIGIN: https://content.example.com
        run: |
          bash scripts/fc/build.sh
          python scripts/fc/test_packages.py
