name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  game-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://test:test@localhost:3306/refactor_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test deploy/fc/internal-auth.test.cjs
      - run: npx prisma generate
      - run: npm run build --workspaces
      - name: Verify generation and session regressions
        run: >-
          npm test --workspace=game-service -- --runInBand
          test/game.service.spec.ts
          test/game-locking.spec.ts
          test/creation-session.service.spec.ts
          test/game-schema-bootstrap.service.spec.ts
          test/admin.service.spec.ts
      - name: Verify production feed query
        run: npm test --workspace=@gamevallies/feed-service -- --runInBand test/trending-production.spec.ts

  ai-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/ai-engine/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m playwright install --with-deps chromium
      - run: python ../../scripts/sync-quality-policy.py --check
      - name: Verify pipeline, prompts and quality repairs
        run: >-
          python -m pytest -q
          tests/test_pipeline_v2_runner.py
          tests/test_prompt_integration.py
          tests/test_generation_v1_localization.py
          tests/test_quality_gate_patch_repair.py
          tests/test_create_progress_and_parallel_qa.py
          tests/test_dialogue_engine.py
          tests/test_dialogue_engine_json_repair.py
          tests/test_code_generator.py
          tests/test_runtime_qa.py
          tests/test_creative_design.py
          tests/test_runtime_isolation.py
          tests/test_fc_runtime.py

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/fc/requirements.txt
      - run: python scripts/fc/test_deploy.py
      - name: Build service images without publishing
        run: |
          for service in user-service game-service social-service feed-service; do
            docker build --build-arg SERVICE="$service" --tag "gamevallies-$service:ci" .
          done
          docker build -f packages/ai-engine/Dockerfile --tag gamevallies-ai:ci .
          docker build -f deploy/fc/Dockerfile.gateway --tag gamevallies-gateway:ci .
          for mode in app content; do
            docker run --rm -e GATEWAY_MODE="$mode" -e FC_INTERNAL_TOKEN="$(python -c 'print("a"*64)')" -e GAME_UPSTREAM=https://game.example.com -e USER_UPSTREAM=https://user.example.com -e AI_UPSTREAM=https://ai.example.com -e FRONTEND_UPSTREAM=https://front.example.com gamevallies-gateway:ci nginx -t
          done
