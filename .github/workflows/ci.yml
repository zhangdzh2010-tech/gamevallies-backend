name: PlayForge CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: willgame
  KUBE_NAMESPACE: playforge

jobs:
  # ============================================================
  # STAGE 1: Lint and Code Quality
  # ============================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run type-check

  # ============================================================
  # STAGE 2: Backend Service Tests
  # ============================================================
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: playforge_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      mongo:
        image: mongo:7-alpine
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/playforge_test
        run: npx prisma generate

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/playforge_test
        run: npx prisma migrate deploy

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/playforge_test
          REDIS_URL: redis://localhost:6379/0
          MONGO_URL: mongodb://localhost:27017/playforge_test
          JWT_SECRET: test-secret-key-12345678901234567890
          NODE_ENV: test
        run: npm run test:unit -- --coverage

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/playforge_test
          REDIS_URL: redis://localhost:6379/0
          MONGO_URL: mongodb://localhost:27017/playforge_test
          JWT_SECRET: test-secret-key-12345678901234567890
          NODE_ENV: test
        run: npm run test:integration

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  # ============================================================
  # STAGE 3: AI Engine Tests
  # ============================================================
  test-ai-engine:
    name: Test AI Engine
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          cd packages/ai-engine
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run pytest
        env:
          LLM_API_KEY: test-key-for-ci
          REDIS_URL: redis://localhost:6379/0
          LOG_LEVEL: debug
        run: |
          cd packages/ai-engine
          pytest --cov=. --cov-report=xml -v

      - name: Upload Python coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/ai-engine/coverage.xml
          flags: python
          name: ai-engine-coverage

  # ============================================================
  # STAGE 4: Frontend Tests (if applicable)
  # ============================================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint
    if: hashFiles('packages/web/**') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests
        run: npm --prefix packages/web run test -- --coverage

      - name: Build frontend
        run: npm --prefix packages/web run build

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/web/coverage/coverage-final.json
          flags: frontend

  # ============================================================
  # STAGE 5: Security Scanning
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || true

  # ============================================================
  # STAGE 6: Build and Push Docker Images
  # ============================================================
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-ai-engine, test-frontend, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (user-service)
        id: meta-user
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-user-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push user-service image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/user-service
          file: ./packages/user-service/Dockerfile
          push: true
          tags: ${{ steps.meta-user.outputs.tags }}
          labels: ${{ steps.meta-user.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-user-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-user-service:buildcache,mode=max

      - name: Extract metadata (game-service)
        id: meta-game
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-game-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push game-service image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/game-service
          file: ./packages/game-service/Dockerfile
          push: true
          tags: ${{ steps.meta-game.outputs.tags }}
          labels: ${{ steps.meta-game.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-game-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-game-service:buildcache,mode=max

      - name: Extract metadata (social-service)
        id: meta-social
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-social-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push social-service image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/social-service
          file: ./packages/social-service/Dockerfile
          push: true
          tags: ${{ steps.meta-social.outputs.tags }}
          labels: ${{ steps.meta-social.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-social-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-social-service:buildcache,mode=max

      - name: Extract metadata (feed-service)
        id: meta-feed
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-feed-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push feed-service image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/feed-service
          file: ./packages/feed-service/Dockerfile
          push: true
          tags: ${{ steps.meta-feed.outputs.tags }}
          labels: ${{ steps.meta-feed.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-feed-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-feed-service:buildcache,mode=max

      - name: Extract metadata (ai-engine)
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-ai-engine
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ai-engine image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/ai-engine
          file: ./packages/ai-engine/Dockerfile
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-ai-engine:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-ai-engine:buildcache,mode=max

      - name: Image digest
        run: |
          echo "user-service: ${{ steps.build-user.outputs.digest }}"
          echo "game-service: ${{ steps.build-game.outputs.digest }}"
          echo "social-service: ${{ steps.build-social.outputs.digest }}"
          echo "feed-service: ${{ steps.build-feed.outputs.digest }}"
          echo "ai-engine: ${{ steps.build-ai.outputs.digest }}"

  # ============================================================
  # STAGE 7: Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging-api.playforge.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update Deployment images (staging)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-user-service:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

          kubectl set image deployment/game-service \
            game-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-game-service:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

          kubectl set image deployment/social-service \
            social-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-social-service:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

          kubectl set image deployment/feed-service \
            feed-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-feed-service:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

          kubectl set image deployment/ai-engine \
            ai-engine=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-ai-engine:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/user-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/game-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/social-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/feed-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/ai-engine -n ${{ env.KUBE_NAMESPACE }} --timeout=5m

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --image=curlimages/curl:latest -n ${{ env.KUBE_NAMESPACE }} -- \
            curl -f http://user-service:3000/health

      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author

  # ============================================================
  # STAGE 8: Deploy to Production (with approval)
  # ============================================================
  deploy-production:
    name: Deploy to Production (Canary)
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.playforge.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify current state
        run: |
          kubectl get deployments -n ${{ env.KUBE_NAMESPACE }}
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }}

      - name: Canary deployment - 10% traffic
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Deploy to 1 out of 10 pods (10% traffic)
          kubectl set image deployment/user-service \
            user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-user-service:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record
          
          # Scale to 10 replicas (1 new, 9 old)
          kubectl scale deployment/user-service --replicas=10 -n ${{ env.KUBE_NAMESPACE }}
          
          # Wait for new pods
          sleep 30
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }} -l app=user-service

      - name: Monitor canary metrics (10%)
        run: |
          sleep 300  # Monitor for 5 minutes
          
          # Check error rate
          ERROR_RATE=$(kubectl logs -n ${{ env.KUBE_NAMESPACE }} -l app=user-service --tail=100 | grep -c ERROR || true)
          
          if [ $ERROR_RATE -gt 10 ]; then
            echo "High error rate detected in canary deployment"
            exit 1
          fi

      - name: Canary deployment - 50% traffic
        run: |
          # Scale to 10 replicas (5 new, 5 old)
          kubectl scale deployment/user-service --replicas=10 -n ${{ env.KUBE_NAMESPACE }}
          
          # Similar for other services
          kubectl scale deployment/game-service --replicas=6 -n ${{ env.KUBE_NAMESPACE }}
          kubectl scale deployment/social-service --replicas=6 -n ${{ env.KUBE_NAMESPACE }}
          kubectl scale deployment/feed-service --replicas=6 -n ${{ env.KUBE_NAMESPACE }}
          
          sleep 30

      - name: Monitor canary metrics (50%)
        run: |
          sleep 300  # Monitor for 5 minutes
          
          # Health check
          kubectl exec -n ${{ env.KUBE_NAMESPACE }} \
            $(kubectl get pod -n ${{ env.KUBE_NAMESPACE }} -l app=user-service -o jsonpath='{.items[0].metadata.name}') \
            -- curl -s http://localhost:3000/health | grep -q "ok" || exit 1

      - name: Full production deployment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Deploy remaining services to 100%
          kubectl set image deployment/game-service \
            game-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-game-service:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

          kubectl set image deployment/social-service \
            social-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-social-service:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

          kubectl set image deployment/feed-service \
            feed-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-feed-service:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

          kubectl set image deployment/ai-engine \
            ai-engine=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-ai-engine:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

          # Final completion: all services to latest
          kubectl set image deployment/user-service \
            user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/playforge-user-service:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

      - name: Wait for all rollouts
        run: |
          kubectl rollout status deployment/user-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/game-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/social-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/feed-service -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/ai-engine -n ${{ env.KUBE_NAMESPACE }} --timeout=5m

      - name: Run end-to-end tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Basic connectivity tests
          kubectl run e2e-test --image=curlimages/curl:latest -n ${{ env.KUBE_NAMESPACE }} -- \
            sh -c "curl -f http://user-service:3000/health && \
                   curl -f http://game-service:3001/health && \
                   curl -f http://social-service:3002/health && \
                   curl -f http://feed-service:3003/health && \
                   curl -f http://ai-engine:3005/health"

      - name: Post-deployment verification
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n ${{ env.KUBE_NAMESPACE }} -o wide
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }} -o wide
          echo "=== Service Status ==="
          kubectl get svc -n ${{ env.KUBE_NAMESPACE }}

      - name: Send success notification
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: 'Production deployment completed successfully'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author

      - name: Send failure notification and rollback
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          kubectl rollout undo deployment/user-service -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout undo deployment/game-service -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout undo deployment/social-service -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout undo deployment/feed-service -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout undo deployment/ai-engine -n ${{ env.KUBE_NAMESPACE }}

      - name: Send rollback notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: 'Production deployment FAILED and has been rolled back'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
