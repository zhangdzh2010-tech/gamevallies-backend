# PlayForge API Gateway - Nginx Configuration

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream definitions
upstream user_service {
    server user-service:3001;
}

upstream game_service {
    server game-service:3002;
}

upstream social_service {
    server social-service:3003;
}

upstream feed_service {
    server feed-service:3004;
}

upstream ai_engine {
    server ai-engine:8000;
}

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, x-admin-token' always;
    add_header 'Access-Control-Max-Age' 86400 always;

    # Handle preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ============== Health Check ==============
    location /health {
        return 200 '{"status":"ok","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # ============== Auth Routes → user-service ==============
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============== User Routes → user-service ==============
    location /api/v1/users/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============== Admin Panel → game-service ==============
    location /admin {
        proxy_pass http://game_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============== Admin API → game-service ==============
    location /api/v1/admin/ {
        proxy_pass http://game_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============== Game Preview/Play → game-service ==============
    location /games/ {
        proxy_pass http://game_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============== Game Comments Routes → social-service ==============
    location ~ /api/v1/games/.*/comments {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://social_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============== Game Routes → game-service ==============
    location /api/v1/games/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://game_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;  # AI generation can take time
    }

    # ============== Social Routes → social-service ==============
    location /api/v1/social/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://social_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/comments {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://social_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/notifications {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://social_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============== Feed Search Routes → feed-service ==============
    location /api/v1/feed/search {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://feed_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============== Feed Routes → feed-service ==============
    location /api/v1/feed/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://feed_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/tags/ {
        proxy_pass http://feed_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/creators/ {
        proxy_pass http://feed_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============== AI Engine Routes ==============
    location /api/v1/ai/ {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass http://ai_engine;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;  # AI generation timeout
    }

    # ============== WebSocket → game-service ==============
    location /ws {
        proxy_pass http://game_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;  # Keep WebSocket alive
        proxy_send_timeout 86400s;
    }

    # ============== AI WebSocket → ai-engine ==============
    location /ws/generate {
        proxy_pass http://ai_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}
