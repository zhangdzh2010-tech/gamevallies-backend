version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gamevallies_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: gamevallies
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: gamevallies_user_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamevallies_user_service
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: mysql://root:password@mysql:3306/gamevallies
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-key-change-in-production
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/packages/user-service/src
    command: npm run dev

volumes:
  mysql_data:
  redis_data:

networks:
  default:
    name: gamevallies_network
