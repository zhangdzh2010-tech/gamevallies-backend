<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Dodge - PlayForge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: {{BACKGROUND_COLOR}};
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000;
            border: 3px solid {{PRIMARY_COLOR}};
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // Game parameters
        const GAME_CONFIG = {
            LIVES: {{LIVES}},
            SPEED_MULTIPLIER: {{SPEED_MULTIPLIER}},
            SHIP_COLOR: '{{PRIMARY_COLOR}}',
            BG_COLOR: '{{BACKGROUND_COLOR}}',
            ASTEROID_RATE: 0.02,
            CRYSTAL_RATE: 0.01
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Color scheme
        const COLORS = {
            bg: '{{BACKGROUND_COLOR}}',
            primary: '{{PRIMARY_COLOR}}',
            secondary: '{{SECONDARY_COLOR}}',
            text: '{{TEXT_COLOR}}'
        };
        
        // Game state
        const game = {
            score: 0,
            lives: GAME_CONFIG.LIVES,
            gameOver: false,
            gamePaused: false,
            speed: 2 * GAME_CONFIG.SPEED_MULTIPLIER,
            maxSpeed: 8
        };
        
        // Player (ship)
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            width: 40,
            height: 40,
            speed: 5,
            velocityX: 0
        };
        
        // Game arrays
        let asteroids = [];
        let crystals = [];
        let particles = [];
        
        // Asteroid class
        class Asteroid {
            constructor() {
                this.x = Math.random() * (canvas.width - 30);
                this.y = -30;
                this.width = 30;
                this.height = 30;
                this.speed = (2 + Math.random() * 3) * GAME_CONFIG.SPEED_MULTIPLIER;
            }
            
            update() {
                this.y += this.speed;
            }
            
            draw() {
                ctx.fillStyle = COLORS.secondary;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = COLORS.primary;
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                
                // Add rotation effect
                ctx.fillStyle = 'rgba(255, 0, 110, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.width / 2 - 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Crystal class
        class Crystal {
            constructor() {
                this.x = Math.random() * (canvas.width - 20);
                this.y = -20;
                this.width = 20;
                this.height = 20;
                this.speed = 1.5 * GAME_CONFIG.SPEED_MULTIPLIER;
                this.rotation = 0;
            }
            
            update() {
                this.y += this.speed;
                this.rotation += 0.05;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.rotation);
                
                ctx.fillStyle = COLORS.primary;
                ctx.beginPath();
                ctx.moveTo(0, -this.width / 2);
                ctx.lineTo(this.width / 2, 0);
                ctx.lineTo(0, this.width / 2);
                ctx.lineTo(-this.width / 2, 0);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(0, 255, 65, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        // Draw player ship
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            // Ship body
            ctx.fillStyle = COLORS.primary;
            ctx.beginPath();
            ctx.moveTo(0, -player.height / 2);
            ctx.lineTo(player.width / 2, player.height / 2);
            ctx.lineTo(0, player.height / 3);
            ctx.lineTo(-player.width / 2, player.height / 2);
            ctx.closePath();
            ctx.fill();
            
            // Ship detail
            ctx.fillStyle = COLORS.secondary;
            ctx.beginPath();
            ctx.arc(0, 0, player.width / 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Glow effect
            ctx.strokeStyle = 'rgba(0, 255, 65, 0.4)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, player.width / 2 + 3, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.restore();
        }
        
        // Update game state
        function update() {
            if (game.gameOver || game.gamePaused) return;
            
            // Player movement with boundaries
            player.x += player.velocityX;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            
            // Spawn asteroids
            if (Math.random() < GAME_CONFIG.ASTEROID_RATE) {
                asteroids.push(new Asteroid());
            }
            
            // Spawn crystals
            if (Math.random() < GAME_CONFIG.CRYSTAL_RATE) {
                crystals.push(new Crystal());
            }
            
            // Update asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                asteroids[i].update();
                
                // Remove off-screen asteroids
                if (asteroids[i].y > canvas.height) {
                    asteroids.splice(i, 1);
                    game.score += 10;
                    continue;
                }
                
                // Collision detection with player
                if (checkCollision(player, asteroids[i])) {
                    asteroids.splice(i, 1);
                    game.lives--;
                    createExplosion(player.x + player.width / 2, player.y + player.height / 2);
                    
                    if (game.lives <= 0) {
                        game.gameOver = true;
                        postGameOver();
                    }
                }
            }
            
            // Update crystals
            for (let i = crystals.length - 1; i >= 0; i--) {
                crystals[i].update();
                
                // Remove off-screen crystals
                if (crystals[i].y > canvas.height) {
                    crystals.splice(i, 1);
                    continue;
                }
                
                // Collision with player
                if (checkCollision(player, crystals[i])) {
                    crystals.splice(i, 1);
                    game.score += 50;
                    createExplosion(crystals[i].x, crystals[i].y, true);
                }
            }
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].life--;
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Increase difficulty
            game.speed = Math.min(game.speed + 0.00005 * GAME_CONFIG.SPEED_MULTIPLIER, game.maxSpeed);
        }
        
        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        // Create explosion particles
        function createExplosion(x, y, isPositive = false) {
            const particleCount = isPositive ? 15 : 20;
            const color = isPositive ? COLORS.primary : COLORS.secondary;
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * 3,
                    vy: Math.sin(angle) * 3,
                    life: 30,
                    color: color,
                    maxLife: 30
                });
            }
        }
        
        // Draw particles
        function drawParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // gravity
                
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color + Math.round(255 * alpha).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid background
            ctx.strokeStyle = 'rgba(0, 255, 65, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw game objects
            drawPlayer();
            asteroids.forEach(a => a.draw());
            crystals.forEach(c => c.draw());
            drawParticles();
            
            // Draw UI
            ctx.fillStyle = COLORS.text;
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Score: ' + game.score, 20, 35);
            ctx.fillText('Lives: ' + game.lives, 20, 65);
            
            // Draw game over screen
            if (game.gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = COLORS.secondary;
                ctx.font = 'bold 56px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);
                
                ctx.font = '24px Arial';
                ctx.fillStyle = COLORS.text;
                ctx.fillText('Score: ' + game.score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('Tap to restart', canvas.width / 2, canvas.height / 2 + 70);
                ctx.textAlign = 'left';
            }
        }
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // WeChat integration
        function postGameOver() {
            if (window.wx) {
                window.wx.miniProgram.postMessage({
                    type: 'game_over',
                    score: game.score
                });
            }
        }
        
        // Input handling
        let keys = {};
        
        // Keyboard controls
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'ArrowLeft') {
                player.velocityX = -player.speed;
            } else if (e.key === 'ArrowRight') {
                player.velocityX = player.speed;
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                player.velocityX = 0;
            }
        });
        
        // Touch controls
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const touchX = touch.clientX - rect.left;
            
            if (touchX < player.x + player.width / 2) {
                player.velocityX = -player.speed;
            } else {
                player.velocityX = player.speed;
            }
        });
        
        canvas.addEventListener('touchend', () => {
            player.velocityX = 0;
        });
        
        // Mouse controls (for desktop testing)
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            
            if (mouseX < player.x + player.width / 2) {
                player.velocityX = -player.speed;
            } else {
                player.velocityX = player.speed;
            }
        });
        
        canvas.addEventListener('mouseleave', () => {
            player.velocityX = 0;
        });
        
        // Restart game
        canvas.addEventListener('click', () => {
            if (game.gameOver) {
                game.gameOver = false;
                game.score = 0;
                game.lives = GAME_CONFIG.LIVES;
                game.speed = 2 * GAME_CONFIG.SPEED_MULTIPLIER;
                asteroids = [];
                crystals = [];
                particles = [];
            }
        });
        
        // Start game loop
        gameLoop();
    </script>
</body>
</html>
