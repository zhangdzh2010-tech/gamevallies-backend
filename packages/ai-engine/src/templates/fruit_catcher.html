<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fruit Catcher - PlayForge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: {{BACKGROUND_COLOR}};
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 600px;
            max-height: 800px;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000;
            border: 3px solid {{PRIMARY_COLOR}};
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // Game parameters
        const GAME_CONFIG = {
            LIVES: {{LIVES}},
            SPEED_MULTIPLIER: {{SPEED_MULTIPLIER}}
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Color scheme
        const COLORS = {
            bg: '{{BACKGROUND_COLOR}}',
            primary: '{{PRIMARY_COLOR}}',
            secondary: '{{SECONDARY_COLOR}}',
            text: '{{TEXT_COLOR}}'
        };
        
        // Game state
        const game = {
            score: 0,
            lives: GAME_CONFIG.LIVES,
            gameOver: false,
            level: 1,
            spawnRate: 0.02,
            maxSpawnRate: 0.08
        };
        
        // Basket (player)
        const basket = {
            x: canvas.width / 2 - 30,
            y: canvas.height - 50,
            width: 60,
            height: 30,
            speed: 6,
            velocityX: 0
        };
        
        // Game arrays
        let fruits = [];
        let particles = [];
        
        // Fruit types with colors and points
        const fruitTypes = [
            { name: 'apple', color: '#ff4444', points: 10, emoji: '🍎' },
            { name: 'banana', color: '#ffdd00', points: 15, emoji: '🍌' },
            { name: 'cherry', color: '#ff0000', points: 20, emoji: '🍒' },
            { name: 'orange', color: '#ff9900', points: 10, emoji: '🍊' },
            { name: 'grape', color: '#9966ff', points: 15, emoji: '🍇' }
        ];
        
        // Fruit class
        class Fruit {
            constructor() {
                this.type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
                this.x = Math.random() * (canvas.width - 20);
                this.y = -20;
                this.width = 20;
                this.height = 20;
                this.speed = (2 + Math.random() * 2) * GAME_CONFIG.SPEED_MULTIPLIER;
                this.rotation = 0;
                this.rotationSpeed = Math.random() * 0.1 - 0.05;
            }
            
            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.rotation);
                
                ctx.fillStyle = this.type.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        // Draw basket
        function drawBasket() {
            ctx.save();
            
            // Basket body
            ctx.fillStyle = COLORS.primary;
            ctx.beginPath();
            ctx.moveTo(basket.x, basket.y);
            ctx.lineTo(basket.x + basket.width, basket.y);
            ctx.lineTo(basket.x + basket.width - 5, basket.y + basket.height);
            ctx.lineTo(basket.x + 5, basket.y + basket.height);
            ctx.closePath();
            ctx.fill();
            
            // Basket outline
            ctx.strokeStyle = COLORS.secondary;
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Basket handle
            ctx.strokeStyle = COLORS.primary;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(basket.x + basket.width / 2, basket.y - 5, basket.width / 2, Math.PI, Math.PI * 2);
            ctx.stroke();
            
            // Glow effect
            ctx.strokeStyle = 'rgba(0, 255, 65, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(basket.x - 3, basket.y);
            ctx.lineTo(basket.x + basket.width + 3, basket.y);
            ctx.stroke();
            
            ctx.restore();
        }
        
        // Update game
        function update() {
            if (game.gameOver) return;
            
            // Basket movement with boundaries
            basket.x += basket.velocityX;
            if (basket.x < 0) basket.x = 0;
            if (basket.x + basket.width > canvas.width) basket.x = canvas.width - basket.width;
            
            // Spawn fruits
            if (Math.random() < game.spawnRate) {
                fruits.push(new Fruit());
            }
            
            // Update fruits
            for (let i = fruits.length - 1; i >= 0; i--) {
                fruits[i].update();
                
                // Remove off-screen fruits
                if (fruits[i].y > canvas.height) {
                    fruits.splice(i, 1);
                    game.lives--;
                    
                    if (game.lives <= 0) {
                        game.gameOver = true;
                        postGameOver();
                    }
                    continue;
                }
                
                // Check collision with basket
                if (checkCollision(basket, fruits[i])) {
                    const points = fruits[i].type.points;
                    game.score += points;
                    fruits.splice(i, 1);
                    
                    // Increase difficulty
                    game.spawnRate = Math.min(game.spawnRate + 0.0005 * GAME_CONFIG.SPEED_MULTIPLIER, game.maxSpawnRate);
                    game.level = Math.floor(game.score / 100) + 1;
                    
                    // Create celebration particles
                    createExplosion(basket.x + basket.width / 2, basket.y, true, points);
                }
            }
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].life--;
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        // Create explosion particles
        function createExplosion(x, y, isPositive = false, value = 0) {
            const particleCount = isPositive ? 12 : 8;
            const color = isPositive ? COLORS.primary : COLORS.secondary;
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * 4,
                    vy: Math.sin(angle) * 4,
                    life: 25,
                    color: color,
                    maxLife: 25
                });
            }
            
            // Add floating score text
            if (isPositive && value > 0) {
                particles.push({
                    x: x,
                    y: y,
                    vx: 0,
                    vy: -2,
                    life: 40,
                    color: COLORS.secondary,
                    maxLife: 40,
                    isText: true,
                    value: '+' + value
                });
            }
        }
        
        // Draw particles
        function drawParticles() {
            particles.forEach(p => {
                if (p.isText) {
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    const alpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color.slice(0, 7) + Math.round(255 * alpha).toString(16).padStart(2, '0');
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.value, p.x, p.y);
                    ctx.textAlign = 'left';
                } else {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2; // gravity
                    
                    const alpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color.slice(0, 7) + Math.round(255 * alpha).toString(16).padStart(2, '0');
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid background
            ctx.strokeStyle = 'rgba(0, 255, 65, 0.05)';
            ctx.lineWidth = 1;
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw game objects
            drawBasket();
            fruits.forEach(f => f.draw());
            drawParticles();
            
            // Draw UI
            ctx.fillStyle = COLORS.text;
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Score: ' + game.score, 20, 35);
            ctx.fillText('Lives: ' + game.lives, 20, 65);
            ctx.fillText('Level: ' + game.level, canvas.width - 150, 35);
            
            // Draw game over screen
            if (game.gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = COLORS.secondary;
                ctx.font = 'bold 56px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);
                
                ctx.font = '28px Arial';
                ctx.fillStyle = COLORS.text;
                ctx.fillText('Final Score: ' + game.score, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText('Level: ' + game.level, canvas.width / 2, canvas.height / 2 + 50);
                
                ctx.font = '20px Arial';
                ctx.fillText('Tap to restart', canvas.width / 2, canvas.height / 2 + 100);
                ctx.textAlign = 'left';
            }
        }
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // WeChat integration
        function postGameOver() {
            if (window.wx) {
                window.wx.miniProgram.postMessage({
                    type: 'game_over',
                    score: game.score,
                    level: game.level
                });
            }
        }
        
        // Touch controls
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const touchX = touch.clientX - rect.left;
            
            if (touchX < basket.x + basket.width / 2) {
                basket.velocityX = -basket.speed;
            } else {
                basket.velocityX = basket.speed;
            }
        });
        
        canvas.addEventListener('touchend', () => {
            basket.velocityX = 0;
        });
        
        // Mouse controls (for desktop testing)
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            
            if (mouseX < basket.x + basket.width / 2) {
                basket.velocityX = -basket.speed;
            } else {
                basket.velocityX = basket.speed;
            }
        });
        
        canvas.addEventListener('mouseleave', () => {
            basket.velocityX = 0;
        });
        
        // Restart game
        canvas.addEventListener('click', () => {
            if (game.gameOver) {
                game.gameOver = false;
                game.score = 0;
                game.lives = GAME_CONFIG.LIVES;
                game.level = 1;
                game.spawnRate = 0.02;
                basket.x = canvas.width / 2 - 30;
                fruits = [];
                particles = [];
            }
        });
        
        // Start game loop
        gameLoop();
    </script>
</body>
</html>
