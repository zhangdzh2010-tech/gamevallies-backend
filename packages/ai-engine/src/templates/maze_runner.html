<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maze Runner - PlayForge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: {{BACKGROUND_COLOR}};
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 600px;
            max-height: 800px;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000;
            border: 3px solid {{PRIMARY_COLOR}};
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const COLORS = {
            bg: '{{BACKGROUND_COLOR}}',
            primary: '{{PRIMARY_COLOR}}',
            secondary: '{{SECONDARY_COLOR}}',
            text: '{{TEXT_COLOR}}'
        };
        
        const TILE_SIZE = 30;
        const COLS = Math.floor(canvas.width / TILE_SIZE);
        const ROWS = Math.floor(canvas.height / TILE_SIZE);
        
        const game = {
            score: 0,
            gameOver: false,
            won: false,
            timeLeft: 300,
            level: 1
        };
        
        const player = {
            x: 1,
            y: 1,
            size: TILE_SIZE - 4
        };
        
        let maze = [];
        let goal = { x: COLS - 2, y: ROWS - 2 };
        let particles = [];
        
        // Generate maze using DFS
        function generateMaze() {
            maze = Array(ROWS).fill(null).map(() => Array(COLS).fill(1));
            
            function carve(x, y) {
                maze[y][x] = 0;
                
                const directions = [
                    [0, -2], [2, 0], [0, 2], [-2, 0]
                ].sort(() => Math.random() - 0.5);
                
                for (const [dx, dy] of directions) {
                    const nx = x + dx;
                    const ny = y + dy;
                    
                    if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && maze[ny][nx] === 1) {
                        maze[y + dy / 2][x + dx / 2] = 0;
                        carve(nx, ny);
                    }
                }
            }
            
            carve(1, 1);
            maze[1][1] = 0;
            maze[goal.y][goal.x] = 0;
        }
        
        function drawMaze() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;
                    
                    if (maze[y][x] === 1) {
                        ctx.fillStyle = COLORS.secondary;
                        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = COLORS.primary;
                        ctx.lineWidth = 1;
                        ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
        }
        
        function drawPlayer() {
            const px = player.x * TILE_SIZE + (TILE_SIZE - player.size) / 2;
            const py = player.y * TILE_SIZE + (TILE_SIZE - player.size) / 2;
            
            ctx.fillStyle = COLORS.primary;
            ctx.beginPath();
            ctx.arc(px + player.size / 2, py + player.size / 2, player.size / 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = COLORS.secondary;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        function drawGoal() {
            const px = goal.x * TILE_SIZE + TILE_SIZE / 2;
            const py = goal.y * TILE_SIZE + TILE_SIZE / 2;
            
            ctx.fillStyle = 'rgba(0, 255, 65, 0.3)';
            ctx.beginPath();
            ctx.arc(px, py, TILE_SIZE / 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = COLORS.primary;
            ctx.beginPath();
            ctx.arc(px, py, TILE_SIZE / 3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function movePlayer(dx, dy) {
            const nx = player.x + dx;
            const ny = player.y + dy;
            
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && maze[ny][nx] === 0) {
                player.x = nx;
                player.y = ny;
                
                if (player.x === goal.x && player.y === goal.y) {
                    game.won = true;
                    game.score += game.timeLeft * 10;
                    createExplosion(goal.x * TILE_SIZE + TILE_SIZE / 2, goal.y * TILE_SIZE + TILE_SIZE / 2, true);
                }
            }
        }
        
        function update() {
            if (game.gameOver || game.won) return;
            
            game.timeLeft--;
            if (game.timeLeft <= 0) {
                game.gameOver = true;
            }
        }
        
        function createExplosion(x, y, isPositive = false) {
            const particleCount = isPositive ? 20 : 10;
            const color = isPositive ? COLORS.primary : COLORS.secondary;
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * 3,
                    vy: Math.sin(angle) * 3,
                    life: 30,
                    color: color,
                    maxLife: 30
                });
            }
        }
        
        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color.slice(0, 7) + Math.round(255 * alpha).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawMaze();
            drawGoal();
            drawPlayer();
            drawParticles();
            
            ctx.fillStyle = COLORS.text;
            ctx.font = 'bold 20px Arial';
            ctx.fillText('Time: ' + Math.ceil(game.timeLeft / 60) + 's', 20, 30);
            ctx.fillText('Score: ' + game.score, 20, 55);
            ctx.fillText('Level: ' + game.level, canvas.width - 150, 30);
            
            if (game.won) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = COLORS.primary;
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = '24px Arial';
                ctx.fillText('Score: ' + game.score, canvas.width / 2, canvas.height / 2 + 30);
                ctx.fillText('Tap to next level', canvas.width / 2, canvas.height / 2 + 80);
                ctx.textAlign = 'left';
            }
            
            if (game.gameOver && !game.won) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = COLORS.secondary;
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('TIME UP!', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = '24px Arial';
                ctx.fillText('Score: ' + game.score, canvas.width / 2, canvas.height / 2 + 30);
                ctx.fillText('Tap to retry', canvas.width / 2, canvas.height / 2 + 80);
                ctx.textAlign = 'left';
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        let swipeStart = { x: 0, y: 0 };
        
        canvas.addEventListener('touchstart', (e) => {
            swipeStart.x = e.touches[0].clientX;
            swipeStart.y = e.touches[0].clientY;
        });
        
        canvas.addEventListener('touchend', (e) => {
            const swipeEnd = {
                x: e.changedTouches[0].clientX,
                y: e.changedTouches[0].clientY
            };
            
            const diffX = swipeEnd.x - swipeStart.x;
            const diffY = swipeEnd.y - swipeStart.y;
            
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) movePlayer(1, 0);
                else movePlayer(-1, 0);
            } else {
                if (diffY > 0) movePlayer(0, 1);
                else movePlayer(0, -1);
            }
        });
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') movePlayer(0, -1);
            else if (e.key === 'ArrowDown') movePlayer(0, 1);
            else if (e.key === 'ArrowLeft') movePlayer(-1, 0);
            else if (e.key === 'ArrowRight') movePlayer(1, 0);
        });
        
        canvas.addEventListener('click', () => {
            if (game.gameOver || game.won) {
                if (game.won) {
                    game.level++;
                    game.score += 100;
                }
                game.gameOver = false;
                game.won = false;
                game.timeLeft = 300 - (game.level * 20);
                player.x = 1;
                player.y = 1;
                particles = [];
                generateMaze();
            }
        });
        
        generateMaze();
        gameLoop();
    </script>
</body>
</html>
