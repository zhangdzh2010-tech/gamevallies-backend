map $http_upgrade $connection_upgrade { default upgrade; '' close; }
resolver 127.0.0.11 valid=10s ipv6=off;
upstream api { zone api 64k; server user-service:3001 resolve; }
upstream games { zone games 64k; server game-service:3002 resolve; }
upstream ai { zone ai 64k; server ai-engine:8000 resolve; }
upstream web { zone web 64k; server frontend:8080 resolve; }
server {
    listen 8080;
    server_name _;
    client_max_body_size 200m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # TLS terminates at the trusted ALB. ECS ingress must be limited to that ALB.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
    location /api/v1/growth { proxy_pass http://games; }
    location = /33zqDBay4T.txt { proxy_pass http://api; }
    location = /9002299597e76e062cb56930926ed40c.txt { proxy_pass http://api; }
    location /api/ { proxy_pass http://api; }
    location /users/ { proxy_pass http://api; }
    location /admin { proxy_pass http://games; }
    location /games/ { proxy_pass http://games; }
    location /game-shell/ { proxy_pass http://games; }
    location /socket.io/ {
        proxy_pass http://games;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /ws/generation/ {
        proxy_pass http://ai;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /ws/socket.io/ {
        proxy_pass http://games/socket.io/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /ws {
        proxy_pass http://games;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location / { proxy_pass http://web; }
}

# Separate ALB target port for the untrusted game-content origin.
server {
    listen 8082;
    server_name _;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    location = /health { return 200 'ok'; }
    location /games/ { proxy_pass http://games; }
    location / { return 404; }
}
