x-runtime: &runtime
  restart: unless-stopped
  init: true
  stop_grace_period: 60s
  env_file: ["${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE}"]
  networks: [gamevallies]
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}
services:
  user-service:
    <<: *runtime
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/user-service:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      PORT: "3001"
      SERVICE_REGION: cn_shanghai
      AI_ENGINE_DEFAULT_REGION: cn_shanghai
      AI_ENGINE_URL: http://ai-engine:8000
      AI_ENGINE_URL_CN_SHANGHAI: http://ai-engine:8000
      GAME_SERVICE_UPSTREAM_URL: http://game-service:3002
      FEED_SERVICE_UPSTREAM_URL: http://feed-service:3004
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s
  game-service:
    <<: *runtime
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/game-service:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      PORT: "3002"
      SERVICE_REGION: cn_shanghai
      AI_ENGINE_DEFAULT_REGION: cn_shanghai
      AI_ENGINE_URL: http://ai-engine:8000
      AI_ENGINE_URL_CN_SHANGHAI: http://ai-engine:8000
      GAME_SERVICE_UPSTREAM_URL: http://game-service:3002
      FEED_SERVICE_UPSTREAM_URL: http://feed-service:3004
      APP_RELEASE_UPLOAD_DIR: /data/app-releases
    volumes: ["app-releases:/data/app-releases"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s
  social-service:
    <<: *runtime
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/social-service:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      PORT: "3003"
      SERVICE_REGION: cn_shanghai
      AI_ENGINE_DEFAULT_REGION: cn_shanghai
      AI_ENGINE_URL: http://ai-engine:8000
      AI_ENGINE_URL_CN_SHANGHAI: http://ai-engine:8000
      GAME_SERVICE_UPSTREAM_URL: http://game-service:3002
      FEED_SERVICE_UPSTREAM_URL: http://feed-service:3004
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s
  feed-service:
    <<: *runtime
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/feed-service:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      PORT: "3004"
      SERVICE_REGION: cn_shanghai
      AI_ENGINE_DEFAULT_REGION: cn_shanghai
      AI_ENGINE_URL: http://ai-engine:8000
      AI_ENGINE_URL_CN_SHANGHAI: http://ai-engine:8000
      GAME_SERVICE_UPSTREAM_URL: http://game-service:3002
      FEED_SERVICE_UPSTREAM_URL: http://feed-service:3004
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s
  ai-engine:
    <<: *runtime
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/ai-engine:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      PORT: "8000"
      SERVICE_REGION: cn_shanghai
      AI_ENGINE_DEFAULT_REGION: cn_shanghai
      AI_ENGINE_URL: http://ai-engine:8000
      AI_ENGINE_URL_CN_SHANGHAI: http://ai-engine:8000
      GAME_SERVICE_UPSTREAM_URL: http://game-service:3002
      FEED_SERVICE_UPSTREAM_URL: http://feed-service:3004
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s
  gateway:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/gateway:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks: [gamevallies]
    ports: ["${GATEWAY_BIND:-127.0.0.1}:8080:8080", "${GATEWAY_BIND:-127.0.0.1}:8082:8082"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
networks:
  gamevallies:
    external: true
    name: gamevallies
volumes:
  app-releases:
