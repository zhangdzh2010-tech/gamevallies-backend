apiVersion: v1
kind: ConfigMap
metadata:
  name: gamevallies-config
  namespace: gamevallies
data:
  # Environment configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  
  # Service discovery
  USER_SERVICE_URL: "http://user-service:3000"
  GAME_SERVICE_URL: "http://game-service:3001"
  SOCIAL_SERVICE_URL: "http://social-service:3002"
  FEED_SERVICE_URL: "http://feed-service:3003"
  AI_ENGINE_URL: "http://ai-engine:3005"
  
  # Database hosts (internal to cluster)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "gamevallies"
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  MONGO_DB: "gamevallies"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  
  # API Configuration
  API_PORT: "3000"
  API_HOST: "0.0.0.0"
  API_VERSION: "v1"
  
  # Pagination defaults
  DEFAULT_PAGE_SIZE: "20"
  MAX_PAGE_SIZE: "100"
  
  # Cache configuration
  CACHE_TTL: "3600"
  CACHE_MAX_SIZE: "1000"
  
  # WebSocket configuration
  WEBSOCKET_PING_INTERVAL: "30000"
  WEBSOCKET_TIMEOUT: "3600000"
  
  # AI Engine configuration
  AI_ENGINE_TIMEOUT: "30000"
  AI_MODEL_TYPE: "gpt-4"
  AI_MAX_TOKENS: "2048"
  
  # Logging
  LOG_FORMAT: "json"
  LOG_DESTINATION: "stdout"
  
  # Feature flags
  FEATURE_AI_ENABLED: "true"
  FEATURE_MULTIPLAYER_ENABLED: "true"
  FEATURE_IN_APP_PURCHASE_ENABLED: "true"
  
  # Rate limiting
  RATE_LIMIT_WINDOW: "60000"
  RATE_LIMIT_MAX_REQUESTS: "1000"
  
  # CORS configuration
  CORS_ORIGIN: "*"
  CORS_CREDENTIALS: "true"
  
  # Monitoring and observability
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.1"
