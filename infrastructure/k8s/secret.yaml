apiVersion: v1
kind: Secret
metadata:
  name: playforge-secret
  namespace: playforge
type: Opaque
stringData:
  # Database credentials
  # IMPORTANT: Replace with actual values before deploying
  # Generate base64: echo -n 'value' | base64
  DATABASE_URL: "postgresql://playforge_user:CHANGE_ME_PASSWORD@postgres:5432/playforge"
  POSTGRES_PASSWORD: "CHANGE_ME_PASSWORD"
  
  MONGO_URL: "mongodb://playforge_user:CHANGE_ME_PASSWORD@mongo:27017/playforge"
  MONGO_PASSWORD: "CHANGE_ME_PASSWORD"
  
  REDIS_URL: "redis://:CHANGE_ME_PASSWORD@redis:6379/0"
  REDIS_PASSWORD: "CHANGE_ME_PASSWORD"
  
  # JWT secrets (generate with: openssl rand -base64 32)
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_32_BYTES_BASE64_ENCODED"
  JWT_REFRESH_SECRET: "CHANGE_ME_JWT_REFRESH_SECRET_32_BYTES_BASE64_ENCODED"
  
  # External API keys
  LLM_API_KEY: "CHANGE_ME_OPENAI_OR_CLAUDE_API_KEY"
  
  # Email configuration
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "noreply@playforge.com"
  SMTP_PASSWORD: "CHANGE_ME_SMTP_PASSWORD"
  
  # Payment gateway (Stripe example)
  STRIPE_SECRET_KEY: "CHANGE_ME_STRIPE_SECRET_KEY"
  STRIPE_PUBLIC_KEY: "CHANGE_ME_STRIPE_PUBLIC_KEY"
  
  # AWS credentials (if using S3 for game assets)
  AWS_ACCESS_KEY_ID: "CHANGE_ME_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_AWS_SECRET_KEY"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "playforge-assets"
  
  # Sentry DSN (error tracking)
  SENTRY_DSN: "https://CHANGE_ME_SENTRY_KEY@sentry.io/PROJECT_ID"
  
  # Basic auth for internal services
  INTERNAL_API_KEY: "CHANGE_ME_INTERNAL_API_KEY"
  
  # Admin credentials (use for initial setup only)
  ADMIN_EMAIL: "admin@playforge.com"
  ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
